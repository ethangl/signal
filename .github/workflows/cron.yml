name: cron

on:
  schedule:
    # 21:30 UTC Mon-Fri = 4:30pm EST / 5:30pm EDT (always after market close).
    # Holidays are deduped at runtime via last_close_date.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          SHORTCUT_NAME: ${{ vars.SHORTCUT_NAME }}

      - name: Commit state if changed
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add last_state.json
          git diff --quiet --cached || git commit -m "update signal state"
          git push
