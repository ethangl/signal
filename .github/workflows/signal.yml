name: signal-bot

on:
  schedule:
    # 21:30 UTC Friday = 4:30pm EST / 5:30pm EDT (always after market close)
    - cron: "30 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python signal_bot.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}

      - name: Commit state if changed
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update signal state"
          git push
